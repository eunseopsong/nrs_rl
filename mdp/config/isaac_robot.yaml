FORCE_SWITCH_RETURN_TAU_M: 0.2
FORCE_SWITCH_RETURN_TAU_D: 0.2
FORCE_SWITCH_RETURN_TAU_K: 0.2
PPO_ACTION_TIMEOUT_S: 0.05
PPO_ACTION_HOLD_S: 0.25
RAW_LOGGING_ENABLED: true
RAW_LOGGING_ROOT: ~/evaluation
RAW_LOGGING_RUN: preston_d14_select_run_in_launch
MEASUREMENT_MODE: continuous
MEASUREMENT_OUTPUT_DIRECTORY: ~/dev_ws/src/y2_ur10skku_control/Y2RobMotion/measured
RECORD_START_TOPIC: /ur10skku/record_boolean_R
RECORD_STOP_TOPIC: /ur10skku/record_boolean_L
