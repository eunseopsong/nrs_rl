# Isaac training: UR10e matching ur10e_v6.usd, TCP 146 mm, 20 N, 125 Hz.
ROBOT_KINEMATICS: ur10e
NUMBER_OF_JOINTS: 6
PACKAGE_BUNDLE_DIR: ''
